spring.application.name=employee-csv-batch

spring.datasource.url=jdbc:postgresql://localhost:5432/employee_batch_db
spring.datasource.username=postgres
spring.datasource.password=Cred.ai

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Maximum allowed input CSV file size
app.csv.max-file-size=10MB

app.batch.run=true